# sereno_light or sereno_black, system-theme writes it to ~/.config/helix/themes/system.toml
theme = "system"

[editor]
line-number = "relative"
bufferline = "always"
color-modes = true
true-color = true
insert-final-newline = false
auto-pairs = false

[editor.auto-save]
after-delay.enable = false

[editor.soft-wrap]
enable = true

[editor.search]
smart-case = true
wrap-around = true

[editor.file-picker]
git-ignore = true
hidden = false

[editor.whitespace.render]
tab = "all"

[editor.lsp]
auto-signature-help = false
display-messages = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "position", "position-percentage", "file-encoding", "file-line-ending"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
insert = "underline"

[editor.indent-guides]
render = false
skip-levels = 0

[keys.insert]
"C-n" = "completion"
"C-space" = "completion"

[keys.normal.space]
B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
M = ":! mark %{buffer_name}"

# theme = "gruvbox_dark_hard"
# theme = "catppuccin_mocha"
# theme = "everforest_dark"
theme = "kanagawa"

[editor]
line-number = "relative"
bufferline = "multiple"
color-modes = true
true-color = true
insert-final-newline = false
auto-pairs = true

[editor.auto-save]
after-delay.enable = false
# after-delay.timeout = 1000

[editor.soft-wrap]
enable = true

[editor.search]
smart-case = true
wrap-around = true

[editor.file-picker]
git-ignore = true
hidden = false

[editor.whitespace.render]
tab = "all"
# newline = "all"

[editor.lsp]
auto-signature-help = false
display-messages = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "position", "position-percentage", "file-encoding", "file-line-ending"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

# [editor.cursor-shape]
# insert = "empty-box"

[editor.indent-guides]
render = false
skip-levels = 0

[keys.insert]
"C-n" = "completion"
"C-space" = "completion"

[keys.normal.space]
B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
M = ":! mark %{buffer_name}"

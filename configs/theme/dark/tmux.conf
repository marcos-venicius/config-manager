# Sereno Dark status line
set -g status-style 'bg=#1d2125,fg=#81878d'
set -g message-style 'bg=#1d2125,fg=#9fcbfe'
set -g message-command-style 'bg=#1d2125,fg=#e2b5ec'
set -g mode-style 'bg=#2b415c,fg=#eae8e0'
set -g pane-border-style 'fg=#2c3136'
set -g pane-active-border-style 'fg=#9fcbfe'
set -g window-status-separator ''
set -g window-status-style 'fg=#81878d'
set -g window-status-activity-style 'fg=#ed756e'
set -g window-status-bell-style 'fg=#ed756e'
set -g window-status-format '#[fg=#81878d,bg=#1d2125] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} '
set -g window-status-current-format '#[fg=#171a1d,bg=#9fcbfe,bold] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} #[nobold]'
set -g status-right '#[fg=#dad7cf,bg=#1d2125,bold]#S#[nobold]  #[fg=#9fcbfe]%d/%m #[fg=#dad7cf]%H:%M:%S '

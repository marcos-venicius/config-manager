# Blacksite status line
set -g status-style 'bg=#0c110f,fg=#4f6257'
set -g message-style 'bg=#0c110f,fg=#39d98a'
set -g message-command-style 'bg=#0c110f,fg=#5cc8cf'
set -g mode-style 'bg=#16261d,fg=#e0ebe3'
set -g pane-border-style 'fg=#1a2620'
set -g pane-active-border-style 'fg=#39d98a'
set -g window-status-separator ''
set -g window-status-style 'fg=#4f6257'
set -g window-status-activity-style 'fg=#e5535b'
set -g window-status-bell-style 'fg=#e5535b'
set -g window-status-format '#[fg=#4f6257,bg=#0c110f] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} '
set -g window-status-current-format '#[fg=#030504,bg=#39d98a,bold] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} #[nobold]'
set -g status-right '#[fg=#39d98a,bg=#0c110f]%d/%m #[fg=#b4c4b9]%H:%M:%S '

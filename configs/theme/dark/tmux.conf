# Kanagawa status line
set -g status-style 'bg=#16161D,fg=#C8C093'
set -g message-style 'bg=#223249,fg=#7E9CD8'
set -g message-command-style 'bg=#223249,fg=#7E9CD8'
set -g mode-style 'bg=#2D4F67,fg=#DCD7BA'
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#7E9CD8'
set -g window-status-separator ''
set -g window-status-style 'fg=#9CABCA'
set -g window-status-activity-style 'fg=#FF5D62'
set -g window-status-bell-style 'fg=#FF5D62'
set -g window-status-format '#[fg=#2A2A37,bg=#16161D]#[fg=#9CABCA,bg=#2A2A37] #W#{?#{!=:#{window_panes},1}, 󰕰 #{window_panes},}#{?window_zoomed_flag, 󰁌,} #[fg=#2A2A37,bg=#16161D] '
set -g window-status-current-format '#[fg=#7E9CD8,bg=#16161D]#[fg=#16161D,bg=#7E9CD8,bold] #W#{?#{!=:#{window_panes},1}, 󰕰 #{window_panes},}#{?window_zoomed_flag, 󰁌,} #[fg=#7E9CD8,bg=#16161D,nobold] '
set -g status-right '#[fg=#957FB8,bg=#16161D]#[fg=#16161D,bg=#957FB8,bold] %d/%m %H:%M:%S #[fg=#957FB8,bg=#16161D,nobold]'

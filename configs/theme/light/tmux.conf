# GitHub Light status line
set -g status-style 'bg=#F6F8FA,fg=#1F2328'
set -g message-style 'bg=#DDF4FF,fg=#0969DA'
set -g message-command-style 'bg=#DDF4FF,fg=#0969DA'
set -g mode-style 'bg=#B6E3FF,fg=#1F2328'
set -g pane-border-style 'fg=#D0D7DE'
set -g pane-active-border-style 'fg=#0969DA'
set -g window-status-separator ''
set -g window-status-style 'fg=#59636E'
set -g window-status-activity-style 'fg=#CF222E'
set -g window-status-bell-style 'fg=#CF222E'
set -g window-status-format '#[fg=#EAEEF2,bg=#F6F8FA]#[fg=#59636E,bg=#EAEEF2] #W#{?#{!=:#{window_panes},1}, 󰕰 #{window_panes},}#{?window_zoomed_flag, 󰁌,} #[fg=#EAEEF2,bg=#F6F8FA] '
set -g window-status-current-format '#[fg=#0969DA,bg=#F6F8FA]#[fg=#FFFFFF,bg=#0969DA,bold] #W#{?#{!=:#{window_panes},1}, 󰕰 #{window_panes},}#{?window_zoomed_flag, 󰁌,} #[fg=#0969DA,bg=#F6F8FA,nobold] '
set -g status-right '#[fg=#8250DF,bg=#F6F8FA]#[fg=#FFFFFF,bg=#8250DF,bold] %d/%m %H:%M:%S #[fg=#8250DF,bg=#F6F8FA,nobold]'

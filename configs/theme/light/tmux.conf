# Sereno Light status line
set -g status-style 'bg=#ebe9e4,fg=#25292f'
set -g message-style 'bg=#ccdff3,fg=#0e1217'
set -g message-command-style 'bg=#ccdff3,fg=#0e1217'
set -g mode-style 'bg=#b9d4f1,fg=#0e1217'
set -g pane-border-style 'fg=#d6d4cd'
set -g pane-active-border-style 'fg=#184687'
set -g window-status-separator ''
set -g window-status-style 'fg=#66635a'
set -g window-status-activity-style 'fg=#b02a2d'
set -g window-status-bell-style 'fg=#b02a2d'
set -g window-status-format '#[fg=#d6d4cd,bg=#ebe9e4]#[fg=#66635a,bg=#d6d4cd] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} #[fg=#d6d4cd,bg=#ebe9e4] '
set -g window-status-current-format '#[fg=#184687,bg=#ebe9e4]#[fg=#f6f4f0,bg=#184687,bold] #I #W#{?#{!=:#{window_panes},1}, 󰕰,}#{?window_zoomed_flag, 󰁌,} #[fg=#184687,bg=#ebe9e4,nobold] '
set -g status-right '#[fg=#652a72,bg=#ebe9e4]#[fg=#f6f4f0,bg=#652a72,bold] %d/%m %H:%M:%S #[fg=#652a72,bg=#ebe9e4,nobold]'

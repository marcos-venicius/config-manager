set -sg repeat-time 0
set -s escape-time 0 # faster command sequences
set -g status-interval 5
set -g mode-keys vi

set-option -g focus-events on
set-option -g allow-rename off

set-window-option -q -g utf8 on

set-option -ga terminal-overrides ",alacritty:Tc"
set -g default-terminal "alacritty"

# Increase scrollback buffer to 10000
set -g history-limit 10000

# Mouse mode
set -g mouse on

# Silence
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
# any, not none: tmux-claude-hatch forwards bells through the alert-bell hook,
# which tmux skips when bell-action is none
set -g bell-action any

set -g status-position bottom
set -g status-justify left

# Bindings

unbind c
bind r source-file ~/.tmux.conf
bind-key a run-shell -b "/home/dev/tools/auth-to-commands/bypass.sh | xargs -I {} tmux display-message -d 2000 '{}' >/dev/null"

bind N new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r L select-window -l

bind -T copy-mode-vi y send-keys -X copy-pipe 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'

# Plugins
#
# tpm and the plugins below are cloned by config-manager (group: tpm).
# prefix + I installs anything added here, prefix + U updates.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'craftzdog/tmux-claude-hatch'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# the date format the hand written status bar used to show
set -g @catppuccin_date_time_text ' %d/%m %H:%M:%S'

# the status line has to be built before tpm sources the theme
set -g status-left-length 20
set -g status-right-length 50
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_date_time}'

# keep this last
run '~/.tmux/plugins/tpm/tpm'

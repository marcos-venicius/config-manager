set -sg repeat-time 0
set -s escape-time 0 # faster command sequences
set -g status-interval 5
set -g mode-keys vi

set-option -g focus-events on
set-option -g allow-rename off

set-window-option -q -g utf8 on

set-option -ga terminal-overrides ",alacritty:Tc"
set -g default-terminal "alacritty"

# Increase scrollback buffer to 10000
set -g history-limit 10000

# Mouse mode
set -g mouse on

# Silence
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Status Bar - Catppuccin Mocha (https://github.com/catppuccin/tmux)
set -g status-bg "#1E1E2E"
set -g status-fg "#CDD6F4"

set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1E1E2E fg=#CDD6F4'
set -g status-left ''
set -g status-right '#[fg=#313244,bg=#1E1E2E]#[fg=#CDD6F4,bg=#313244] %d/%m #[fg=#CBA6F7,bg=#313244]#[fg=#1E1E2E,bg=#CBA6F7] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=#1E1E2E bg=#CBA6F7 bold'
setw -g window-status-current-format ' #I#[fg=#11111B]:#[fg=#1E1E2E]#W#[fg=#11111B]#F #[fg=#CBA6F7,bg=#1E1E2E]'

setw -g window-status-style 'fg=#7F849C bg=#1E1E2E'
setw -g window-status-format ' #I#[fg=#7F849C]:#[fg=#7F849C]#W#[fg=#7F849C]#F '

setw -g window-status-activity-style 'fg=#F9E2AF bg=#1E1E2E'
setw -g window-status-bell-style 'fg=#1E1E2E bg=#F9E2AF bold'

# Panes
set -g pane-border-style 'fg=#45475A'
set -g pane-active-border-style 'fg=#CBA6F7'
set -g display-panes-colour '#89B4FA'
set -g display-panes-active-colour '#CBA6F7'

# Messages / command prompt
set -g message-style 'fg=#1E1E2E bg=#F9E2AF bold'
set -g message-command-style 'fg=#CDD6F4 bg=#45475A'

# Copy mode / selection
set -g mode-style 'fg=#1E1E2E bg=#F5E0DC'
set -g clock-mode-colour '#89B4FA'

# Bindings

unbind c
bind r source-file ~/.tmux.conf
bind-key a run-shell -b "/home/dev/tools/auth-to-commands/bypass.sh | xargs -I {} tmux display-message -d 2000 '{}' >/dev/null"

bind N new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r L select-window -l

bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'

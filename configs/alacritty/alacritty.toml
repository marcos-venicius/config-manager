[window]
# opacity = 0.9
padding = { x = 5, y = 0 }
# decorations = "None"
dynamic_title = false

[font]
normal = { family = "JetBrainsMonoNerdFont" }
size = 9

[mouse]
hide_when_typing = true

# =============================================================
# Catppuccin Mocha - https://github.com/catppuccin/alacritty
# =============================================================

[colors.primary]
background        = "#1E1E2E"  # base
foreground        = "#CDD6F4"  # text
dim_foreground    = "#7F849C"  # overlay1
bright_foreground = "#CDD6F4"  # text

[colors.cursor]
text   = "#1E1E2E"  # base
cursor = "#F5E0DC"  # rosewater

[colors.vi_mode_cursor]
text   = "#1E1E2E"  # base
cursor = "#B4BEFE"  # lavender

[colors.selection]
text       = "#1E1E2E"  # base
background = "#F5E0DC"  # rosewater

[colors.search.matches]
foreground = "#1E1E2E"  # base
background = "#A6ADC8"  # subtext0

[colors.search.focused_match]
foreground = "#1E1E2E"  # base
background = "#A6E3A1"  # green

[colors.footer_bar]
foreground = "#1E1E2E"  # base
background = "#A6ADC8"  # subtext0

[colors.hints.start]
foreground = "#1E1E2E"  # base
background = "#F9E2AF"  # yellow

[colors.hints.end]
foreground = "#1E1E2E"  # base
background = "#A6ADC8"  # subtext0

[colors.normal]
black   = "#45475A"  # surface1
red     = "#F38BA8"  # red
green   = "#A6E3A1"  # green
yellow  = "#F9E2AF"  # yellow
blue    = "#89B4FA"  # blue
magenta = "#F5C2E7"  # pink
cyan    = "#94E2D5"  # teal
white   = "#BAC2DE"  # subtext1

[colors.bright]
black   = "#585B70"  # surface2
red     = "#F38BA8"  # red
green   = "#A6E3A1"  # green
yellow  = "#F9E2AF"  # yellow
blue    = "#89B4FA"  # blue
magenta = "#F5C2E7"  # pink
cyan    = "#94E2D5"  # teal
white   = "#A6ADC8"  # subtext0

[colors.dim]
black   = "#45475A"  # surface1
red     = "#F38BA8"  # red
green   = "#A6E3A1"  # green
yellow  = "#F9E2AF"  # yellow
blue    = "#89B4FA"  # blue
magenta = "#F5C2E7"  # pink
cyan    = "#94E2D5"  # teal
white   = "#BAC2DE"  # subtext1

[env]
TERM = "alacritty"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

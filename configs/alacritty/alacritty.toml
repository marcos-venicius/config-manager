[general]
# colors live in configs/theme, system-theme writes the active set here
import = ["~/.local/state/system-theme/alacritty.toml"]

[window]
padding = { x = 5, y = 0 }
dynamic_title = false

[font]
normal = { family = "AtkynsonMono Nerd Font" }
size = 11.5

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
